# log dir
log_dir: ./debug_logs/ucf_L1_blur_sigma1_test

# model setting
pretrained: ./training/pretrained/xception-b5690688.pth
model_name: ucf
backbone_name: xception
encoder_feat_dim: 512

# backbone setting
backbone_config:
  mode: adjust_channel
  num_classes: 2
  inc: 3
  dropout: false

# dataset
all_dataset: [FaceForensics++, FF-F2F, FF-DF, FF-FS, FF-NT, FaceShifter, DeepFakeDetection, Celeb-DF-v1, Celeb-DF-v2, DFDCP, DFDC, DeeperForensics-1.0, UADFV]
train_dataset: [FF-F2F, FF-DF, FF-FS, FF-NT]
test_dataset: [FF-DF]
dataset_type: pair
dataset_json_folder: ./preprocessing/dataset_json_study_L1_blur_sigma1

compression: raw
train_batchSize: 16
test_batchSize: 4
workers: 0
frame_num: {'train': 32, 'test': 8}
resolution: 256
with_mask: false
with_landmark: false
save_feat: false

# label settings
label_dict:
  DFD_fake: 1
  DFD_real: 0
  FaceShifter: 1
  FF-FH: 1
  FF-DF: 1
  FF-F2F: 2
  FF-FS: 3
  FF-NT: 4
  FF-real: 0
  CelebDFv1_real: 0
  CelebDFv1_fake: 1
  CelebDFv2_real: 0
  CelebDFv2_fake: 1
  DFDCP_Real: 0
  DFDCP_FakeA: 1
  DFDCP_FakeB: 1
  DFDC_Fake: 1
  DFDC_Real: 0
  DF_fake: 1
  DF_real: 0
  UADFV_Fake: 1
  UADFV_Real: 0
  roop_Fake: 1
  roop_Real: 0

# data augmentation
use_data_augmentation: true
data_aug:
  flip_prob: 0.5
  rotate_prob: 0.5
  rotate_limit: [-10, 10]
  blur_prob: 0.5
  blur_limit: [3, 7]
  brightness_prob: 0.5
  brightness_limit: [-0.1, 0.1]
  contrast_limit: [-0.1, 0.1]
  quality_lower: 40
  quality_upper: 100

# mean and std for normalization
mean: [0.5, 0.5, 0.5]
std: [0.5, 0.5, 0.5]

# optimizer config
optimizer:
  type: adam
  adam:
    lr: 0.0002
    beta1: 0.9
    beta2: 0.999
    eps: 0.00000001
    weight_decay: 0.0005
    amsgrad: false
  sgd:
    lr: 0.0002
    momentum: 0.9
    weight_decay: 0.0005

# training config
lr_scheduler: null
nEpochs: 5
start_epoch: 0
save_epoch: 1
rec_iter: 100
logdir: ./logs/ucf_L1_blur_sigma1_test
manualSeed: 1024
save_ckpt: false

# loss function
loss_func:
  cls_loss: cross_entropy
  spe_loss: cross_entropy
  con_loss: contrastive_regularization
  rec_loss: l1loss
losstype: null

# metric
metric_scoring: auc

# cuda
cuda: false
cudnn: false

# study-layer metadata
dataset_split: test
split_tag: test
condition_code: L1_blur_sigma1
family_id: spatial
study_output_root: ../study_outputs